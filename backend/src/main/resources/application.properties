
# Profile mac dinh khi chay local
spring.profiles.default=local

# Application
spring.application.name=meal-booking-api

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/meal_booking_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Local database bootstrap (only dedicated localhost DB; no remote provisioning)
app.database.bootstrap.enabled=${DB_BOOTSTRAP_ENABLED:true}

# Database schema / migrations
spring.datasource.hikari.schema=public
spring.datasource.hikari.read-only=false
spring.flyway.enabled=true
# Dedicated migration connection: do not inherit pooled JPA transaction state.
# Resolve the effective datasource credentials, including untracked local overrides.
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
# Flyway executes DDL; request read-write for this session only.
spring.flyway.init-sqls=SET SESSION CHARACTERISTICS AS TRANSACTION READ WRITE;
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=false
# Explicit opt-in for legacy databases without history: baseline at 0 so V1 is not skipped.
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false
spring.sql.init.mode=never

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# Jackson
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Server
server.port=${PORT:${SERVER_PORT:8080}}
server.shutdown=graceful

# Application config
app.time-zone=Asia/Ho_Chi_Minh
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# JWT
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# Explicit provisioning on an empty database.
app.initial-admin.enabled=${INITIAL_ADMIN_ENABLED:false}
app.initial-admin.username=${INITIAL_ADMIN_USERNAME:}
app.initial-admin.employee-code=${INITIAL_ADMIN_EMPLOYEE_CODE:}
app.initial-admin.full-name=${INITIAL_ADMIN_FULL_NAME:}
app.initial-admin.department=${INITIAL_ADMIN_DEPARTMENT:}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}

# Registration
app.registration.exclude-weekends=${EXCLUDE_WEEKENDS:true}

# Admin menu upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.jpa.mapping-resources=META-INF/orm.xml
